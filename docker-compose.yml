name: jobrec

services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    container_name: jobrec-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: jobrec-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: jobrec-frontend
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Auto-ingestion timer (plan §20.1): re-runs the live pipeline on a cadence
  # so the corpus stays fresh without manual script runs. Rotates through the
  # query set below, one full cycle every INGEST_INTERVAL_SECONDS (6h default).
  # Disabled on demand: docker compose stop ingest  (or remove from a profile).
  ingest:
    image: jobrec-backend:latest   # reuses the image the backend service builds
    container_name: jobrec-ingest
    volumes:
      - ./backend:/app             # live code — same mount as the backend service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-21600}
    entrypoint: ["sh", "-c"]
    command:
      - |
        queries="python developer|data analyst|devops engineer|machine learning engineer"
        interval="$${INGEST_INTERVAL_SECONDS:-21600}"
        while true; do
          IFS='|'
          for q in $$queries; do
            echo "[ingest] $$(date -u +%FT%TZ) fetching: $$q"
            python scripts/fetch_jobs_live.py --query "$$q" --upsert \
              || echo "[ingest] $$q failed - will retry next cycle"
          done
          IFS=' '
          echo "[ingest] cycle complete; sleeping $$interval seconds"
          sleep "$$interval"
        done
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:

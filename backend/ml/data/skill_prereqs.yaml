# Curated skill graph edges (plan §5/§7/§8), seeded by scripts/seed_canonical.py
# and merged (DB wins) by services/skill_graph.py.
#
# Edge semantics: from: A → to: B
#   prereq    — A is a practical prerequisite for B (roadmap ordering credit;
#               holders of A get partial transferability toward B)
#   transfer  — holders of A can transfer INTO B with strong credit
#               (gap engine class; credit = 0.7 × min(1, weight))
#   supersedes — A is the newer skill replacing B
#
# Deliberately NO edges targeting kubernetes / docker / terraform so the
# required-skill gaps for DevOps roles stay visible in the gap engine demo
# (test_recommender asserts those appear in missing_skills).

